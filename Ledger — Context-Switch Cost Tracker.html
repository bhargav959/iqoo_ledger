<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ledger — Context-Switch Cost Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Spectral:ital@1&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root {
    --ink: #0E1116;
    --paper: #F7F5F0;
    --cost: #E8622C;
    --credit: #4A7C6F;
    --grey: #8B8578;
    --panel: #171B21;
    --panel-2: #1F242C;
    --rule: #2C323C;
    --rule-light: #3a4048;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ink); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    font-family: 'Spectral', Georgia, 'Times New Roman', serif;
    color: var(--paper);
    -webkit-font-smoothing: antialiased;
  }
  .mono {
    font-family: 'IBM Plex Mono', 'SF Mono', Consolas, monospace;
  }
  #root { min-height: 100%; }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  /* header / statement strip */
  .statement-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 18px;
    margin-bottom: 22px;
  }
  .brand {
    font-size: 15px;
    letter-spacing: 0.02em;
  }
  .brand .mark { color: var(--cost); font-style: italic; }
  .brand .date {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--grey);
    margin-top: 4px;
  }
  .avatar {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--grey);
    text-align: right;
  }

  /* balance block */
  .balance-block {
    padding: 10px 0 26px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 26px;
  }
  .balance-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--grey);
    margin-bottom: 6px;
  }
  .balance-figure {
    font-size: 56px;
    line-height: 1;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .balance-figure .unit {
    font-size: 22px;
    color: var(--grey);
    font-weight: 400;
    margin-left: 6px;
  }
  .balance-sub {
    margin-top: 10px;
    font-size: 14.5px;
    color: #C9C4B8;
    max-width: 46ch;
    line-height: 1.5;
  }
  .balance-sub b { color: var(--paper); font-weight: 600; }

  .stat-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
    margin-top: 22px;
  }
  .stat {
    border-left: 1px solid var(--rule);
    padding: 2px 0 0 16px;
  }
  .stat:first-child { border-left: none; padding-left: 0; }
  .stat-num {
    font-size: 26px;
    font-weight: 600;
  }
  .stat-num.cost { color: var(--cost); }
  .stat-num.credit { color: var(--credit); }
  .stat-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--grey);
    margin-top: 3px;
  }

  /* section title */
  .section-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--grey);
    margin: 34px 0 12px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  /* timeline / ledger rows */
  .ledger {
    border-top: 1px solid var(--rule);
  }
  .row {
    display: grid;
    grid-template-columns: 58px 1fr auto;
    gap: 14px;
    align-items: center;
    padding: 11px 0;
    border-bottom: 1px solid var(--rule);
    cursor: default;
  }
  .row .time {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--grey);
  }
  .row .desc { font-size: 15px; line-height: 1.3; }
  .row .desc .app {
    font-weight: 600;
  }
  .row .desc .switch-tag {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--cost);
    border: 1px solid rgba(232,98,44,0.35);
    padding: 1px 5px;
    border-radius: 2px;
    margin-left: 8px;
    vertical-align: middle;
  }
  .row .desc .deep-tag {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--credit);
    border: 1px solid rgba(74,124,111,0.35);
    padding: 1px 5px;
    border-radius: 2px;
    margin-left: 8px;
    vertical-align: middle;
  }
  .row .amount {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    text-align: right;
    white-space: nowrap;
  }
  .row .amount.cost { color: var(--cost); }
  .row .amount.credit { color: var(--credit); }

  /* chart panel */
  .panel {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 20px 18px 14px;
    margin-top: 6px;
  }
  .bars {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    height: 120px;
    margin-top: 8px;
  }
  .bar-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    justify-content: flex-end;
  }
  .bar {
    width: 100%;
    border-radius: 2px 2px 0 0;
    background: linear-gradient(180deg, var(--cost), rgba(232,98,44,0.55));
    position: relative;
  }
  .bar-hour {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--grey);
    margin-top: 6px;
  }

  /* insight callout */
  .insight {
    border-left: 2px solid var(--cost);
    padding: 4px 0 4px 16px;
    margin-top: 26px;
    font-size: 15.5px;
    line-height: 1.6;
    color: #DAD5C8;
  }
  .insight b { color: var(--paper); }
  .insight .fig { color: var(--cost); font-weight: 600; }

  /* recommendation list */
  .reco {
    margin-top: 14px;
  }
  .reco-item {
    display: flex;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--rule);
  }
  .reco-item:last-child { border-bottom: none; }
  .reco-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--credit);
    padding-top: 3px;
    min-width: 16px;
  }
  .reco-body b { display: block; font-size: 15px; margin-bottom: 2px; }
  .reco-body span { font-size: 13.5px; color: #ADA898; line-height: 1.5; }

  .toggle-row {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  .toggle-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--grey);
    background: transparent;
    border: 1px solid var(--rule-light);
    border-radius: 2px;
    padding: 5px 10px;
    cursor: pointer;
  }
  .toggle-btn.active {
    color: var(--ink);
    background: var(--paper);
    border-color: var(--paper);
  }

  footer.note {
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--rule);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--grey);
    line-height: 1.7;
  }

  @media (max-width: 480px) {
    .balance-figure { font-size: 42px; }
    .stat-row { grid-template-columns: 1fr 1fr; row-gap: 16px; }
    .stat:nth-child(3) { border-left: none; padding-left: 0; grid-column: 1 / -1; }
    .row { grid-template-columns: 46px 1fr; }
    .row .amount { grid-column: 1 / -1; text-align: left; padding-left: 60px; margin-top: -4px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState } = React;

const LOG = [
  { t: "09:02", kind: "deep", label: "VS Code — capstone-model.py", detail: "Deep work block", amount: "+52 min", tag: "focus" },
  { t: "09:54", kind: "switch", label: "Slack → #team-standup", detail: "Interrupted mid-function", amount: "−9 min", tag: "switch" },
  { t: "10:03", kind: "deep", label: "VS Code — capstone-model.py", detail: "Resumed, ramp-up lag", amount: "+31 min", tag: "focus" },
  { t: "10:34", kind: "switch", label: "Gmail — 3 unread", detail: "Checked between cells", amount: "−4 min", tag: "switch" },
  { t: "10:38", kind: "switch", label: "Instagram", detail: "11 min scroll", amount: "−15 min", tag: "switch" },
  { t: "10:53", kind: "switch", label: "VS Code (re-entry)", detail: "Re-reading last 20 lines", amount: "−6 min", tag: "reentry" },
  { t: "10:59", kind: "deep", label: "VS Code — capstone-model.py", detail: "Deep work block", amount: "+38 min", tag: "focus" },
  { t: "11:37", kind: "switch", label: "WhatsApp — group chat", detail: "Notification-triggered", amount: "−7 min", tag: "switch" },
  { t: "11:44", kind: "switch", label: "Chrome — 14 tabs", detail: "Research spiral", amount: "−12 min", tag: "switch" },
];

const HOURS = [
  { h: "9", v: 18 }, { h: "10", v: 34 }, { h: "11", v: 41 },
  { h: "12", v: 22 }, { h: "1", v: 52 }, { h: "2", v: 28 },
  { h: "3", v: 46 }, { h: "4", v: 19 }, { h: "5", v: 8 },
];

function Bars() {
  const max = Math.max(...HOURS.map(d => d.v));
  return (
    <div className="bars">
      {HOURS.map((d, i) => (
        <div className="bar-col" key={i}>
          <div className="bar" style={{ height: `${(d.v / max) * 100}%` }} title={`${d.v} min lost`} />
          <div className="bar-hour">{d.h}</div>
        </div>
      ))}
    </div>
  );
}

function App() {
  const [range, setRange] = useState("Today");

  return (
    <div className="wrap">
      <div className="statement-head">
        <div className="brand">
          <span className="mark">Ledger</span> — focus statement
          <span className="date">Tuesday, 22 September 2026 · updated live</span>
        </div>
        <div className="avatar">B.<br/>CSE (AI), Amrita<br/>local session</div>
      </div>

      <div className="balance-block">
        <div className="balance-label">TODAY'S FOCUS BALANCE</div>
        <div className="balance-figure">2h 47m <span className="unit">of 6h 15m tracked</span></div>
        <div className="balance-sub">
          You spent <b>1h 33m</b> paying for context switches today — roughly <b>25%</b> of your tracked time went to recovery, not work.
        </div>

        <div className="toggle-row">
          {["Today", "This week", "This month"].map(r => (
            <button
              key={r}
              className={"toggle-btn" + (range === r ? " active" : "")}
              onClick={() => setRange(r)}
            >{r}</button>
          ))}
        </div>

        <div className="stat-row">
          <div className="stat">
            <div className="stat-num credit">1h 21m</div>
            <div className="stat-label">DEEP WORK CREDITED</div>
          </div>
          <div className="stat">
            <div className="stat-num cost">1h 33m</div>
            <div className="stat-label">SWITCH COST DEBITED</div>
          </div>
          <div className="stat">
            <div className="stat-num">14</div>
            <div className="stat-label">SWITCHES LOGGED</div>
          </div>
        </div>
      </div>

      <div className="section-title">
        <span>COST BY HOUR (MIN LOST)</span>
        <span>PEAK: 1–2 PM</span>
      </div>
      <div className="panel">
        <Bars />
      </div>

      <div className="insight">
        Your costliest hour is <b>1–2 PM</b>, right after lunch — averaging <span className="fig">52 min</span> lost
        to switching, nearly 3× your morning rate. Most switches in that window start from <b>Chrome</b>, not notifications.
      </div>

      <div className="section-title">
        <span>TRANSACTION LOG</span>
        <span>09:00 – 11:51</span>
      </div>
      <div className="ledger">
        {LOG.map((r, i) => (
          <div className="row" key={i}>
            <div className="time">{r.t}</div>
            <div className="desc">
              <span className="app">{r.label}</span>
              {r.kind === "deep"
                ? <span className="deep-tag">focus</span>
                : <span className="switch-tag">{r.tag}</span>}
              <div style={{ color: "#8B8578", fontSize: "12.5px", marginTop: "2px" }}>{r.detail}</div>
            </div>
            <div className={"amount " + r.kind}>{r.amount}</div>
          </div>
        ))}
      </div>

      <div className="section-title">
        <span>WHAT WOULD CHANGE THE BALANCE</span>
      </div>
      <div className="reco">
        <div className="reco-item">
          <div className="reco-num">01</div>
          <div className="reco-body">
            <b>Batch Slack + WhatsApp to two windows</b>
            <span>Your notification-triggered switches cluster around 10 and 11:30. Two 10-minute batch windows would recover an estimated 22 min/day.</span>
          </div>
        </div>
        <div className="reco-item">
          <div className="reco-num">02</div>
          <div className="reco-body">
            <b>Close the tab spiral before 1 PM</b>
            <span>Chrome research spirals cost more than any single app today. A 5-tab cap during your 1–2 PM block would target your single worst hour.</span>
          </div>
        </div>
        <div className="reco-item">
          <div className="reco-num">03</div>
          <div className="reco-body">
            <b>Protect the 9–10 AM block</b>
            <span>Your only uninterrupted stretch today. It's also your lowest-cost hour — worth defending on the calendar.</span>
          </div>
        </div>
      </div>

      <footer className="note">
        DEMO DATA — this session is illustrative, generated to show the product concept.<br/>
        Ledger tracks active window + tab titles locally; switch cost is modeled from published attention-residue research, not billed time.
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
